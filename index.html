<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="x-app-legacy" content="Rattana Purchase Chat v2.47">
<meta name="x-app-legacy2" content="RTN Chat Hub v2.47">
<title>Rattana One Chat v2.47 — ย้ายไปลิงก์ใหม่</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 19/10/2569 แอพย้ายไป https://rattanaphaiboon.github.io/onechat/ (repo rattanaphaiboon/onechat)
     หน้านี้พาไปลิงก์ใหม่ทันที พร้อม ?…/#… เดิม (ลิงก์แชทจากแจ้งเตือน · ?demo=1 · ผลล็อกอิน)
     แอพที่เปิดค้างบนลิงก์เก่า: ตัวเช็คอัปเดตเห็น v2.47 → แถบ "มีเวอร์ชันใหม่" → กดแล้วมาหน้านี้ → ไปลิงก์ใหม่
     sw.js เดิมยังอยู่ — แจ้งเตือนของเครื่องที่ยังไม่ได้เปิดลิงก์ใหม่ยังส่งถึง กดแล้วมาหน้านี้ · ลิงก์ทดสอบ /beta/ ยังอยู่ที่นี่ -->
<script>
(function(){
  var NEW = 'https://rattanaphaiboon.github.io/onechat/';
  var q = location.search.replace(/([?&])v=\d+&?/, '$1').replace(/[?&]$/, '');
  var to = NEW + q + location.hash, done = false;
  function go(){ if(done) return; done = true; location.replace(to); }
  setTimeout(go, 3000);
  // ปิดแจ้งเตือนของลิงก์เดิมในเครื่องนี้ก่อน — กันเด้งซ้ำ 2 ครั้งเมื่อเปิดแจ้งเตือนที่ลิงก์ใหม่ (แบบเดียวกับการย้ายครั้งก่อน 26/09)
  // (ลิงก์ทดสอบ /beta/ ใช้ service worker ตัวเดียวกัน — เปิด beta อีกครั้งระบบลงทะเบียนให้ใหม่เอง)
  (async function(){
    try{
      if('serviceWorker' in navigator){
        var regs = await navigator.serviceWorker.getRegistrations();
        for(var i = 0; i < regs.length; i++){
          try{ var s = await regs[i].pushManager.getSubscription(); if(s) await s.unsubscribe(); }catch(e){}
          try{ await regs[i].unregister(); }catch(e){}
        }
      }
    }catch(e){}
    go();
  })();
})();
</script>
</head><body style="margin:0;background:#0d1b3e;color:#fff;font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:20px">
<div><p style="font-size:17px;font-weight:700">Rattana One Chat ย้ายไปลิงก์ใหม่แล้ว</p>
<p><a href="https://rattanaphaiboon.github.io/onechat/" style="color:#e8c86a;font-size:16px">https://rattanaphaiboon.github.io/onechat/</a></p>
<p style="opacity:.75;font-size:13px">เข้าสู่ระบบ Google อีกครั้ง · เปิดแจ้งเตือนใหม่ · เพิ่มไอคอนบนหน้าจอโฮมใหม่จากลิงก์นี้</p></div>
</body></html>
